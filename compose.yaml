services:
  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/backend
        # - vscode-server:/root/.vscode-server
    ports:
      - 8000:8080
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - worknet
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    volumes:
      - ./frontend:/app
        # - vscode-server:/root/.vscode-server
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - worknet
  db:
    image: mysql:latest
    container_name: db
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: adminpwd
      MYSQL_DATABASE: work-memo
      MYSQL_USER: terrain
      MYSQL_PASSWORD: let_me_in_please
    volumes:
      - db-volume:/var/lib/mysql/
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - worknet
volumes:
  db-volume:
    #vscode-server:
networks:
  worknet:
