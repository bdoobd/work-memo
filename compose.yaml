services:
  db:
    image: mysql:latest
    container_name: db
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: adminpwd
      MYSQL_DATABASE: work-memo
      MYSQL_USER: terrain
      MYSQL_PASSWORD: let_me_in_please
    volumes:
      - db-volume:/var/lib/mysql/
    networks:
      - worknet
volumes:
  db-volume:
networks:
  worknet:
